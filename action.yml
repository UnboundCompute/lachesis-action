name: "Lachesis Security Scan"
description: "Trace untrusted input to sinks and catch the endpoint that forgot the authorization check, inline in GitHub code scanning."
branding:
  icon: "git-branch"
  color: "purple"

inputs:
  source:
    description: "Directory to analyze, relative to the repo root."
    default: "."
  python-version:
    description: "Python runtime for the analyzer. Keep the default on the tested compatibility floor."
    default: "3.11"
  lachesis-repo:
    description: "Git URL to install Lachesis from (until the wheel is on PyPI)."
    default: "https://github.com/UnboundCompute/lachesis"
  lachesis-ref:
    description: "Branch, tag, or SHA of Lachesis to install."
    default: "main"
  atropos-repo:
    description: "Git URL for the Atropos taint-model catalog."
    default: "https://github.com/UnboundCompute/atropos"
  atropos-ref:
    description: "Branch, tag, or SHA of Atropos to use. Pin a tag or SHA for reproducibility."
    default: "main"
  analyze-args:
    description: "Extra flags passed to lachesis-analyze. Kept light by default."
    default: "--prune --incremental"
  c-jobs:
    description: "Optional Clang frontend concurrency override; empty uses the adaptive engine default."
    default: ""
  kuzu-buffer-pool-size:
    description: "Kùzu buffer pool ceiling in bytes for graph materialization."
    default: "1073741824"
  sarif-file:
    description: "Where to write the SARIF report."
    default: "lachesis.sarif"
  changed-files:
    description: "Optional space/comma-separated list; when set, only findings in these files are reported."
    default: ""
  exclude:
    description: "Optional space/comma-separated paths/globs; findings under these (e.g. a fixtures or vendor dir) are dropped."
    default: ""
  upload:
    description: "Upload the SARIF to GitHub code scanning (needs security-events: write)."
    default: "true"
  fail-on:
    description: "Fail the step if any finding is at this level or above: none | note | warning | error."
    default: "none"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node
      # Needed at analyze time: the TypeScript frontend runs under node.
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Fingerprint analyzer toolchain
      id: toolchain
      shell: bash
      run: |
        {
          python3 --version
          node --version
          (clang --version 2>/dev/null || echo "clang unavailable")
        } | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())' | {
          read fingerprint
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        }

    - name: Install Lachesis (from source)
      id: install-lachesis
      # Until lachesis-cpg is on PyPI, install from GitHub. The TypeScript compiler
      # is a build artifact absent from the repo, so vendor it FIRST (a pure-Python
      # fetch, no npm), then it gets packaged into the install.
      shell: bash
      run: |
        SRC="$RUNNER_TEMP/lachesis-src"
        rm -rf "$SRC"
        # Keep ref flexibility (branch, tag, or SHA) without transferring every
        # blob in the engine history. Checkout fetches only the selected tree.
        git clone --filter=blob:none --no-checkout "${{ inputs.lachesis-repo }}" "$SRC"
        git -C "$SRC" checkout "${{ inputs.lachesis-ref }}"
        echo "engine_sha=$(git -C "$SRC" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        python3 -m pip install --upgrade pip
        python3 "$SRC/tools/vendor_typescript.py"
        python3 -m pip install "$SRC"

    - name: Install Atropos catalog
      id: install-atropos
      shell: bash
      run: |
        CATALOG="$RUNNER_TEMP/atropos"
        rm -rf "$CATALOG"
        git clone --filter=blob:none --no-checkout "${{ inputs.atropos-repo }}" "$CATALOG"
        git -C "$CATALOG" checkout "${{ inputs.atropos-ref }}"
        python3 "$CATALOG/tools/validate.py"
        echo "ATROPOS_ROOT=$CATALOG" >> "$GITHUB_ENV"
        echo "catalog_sha=$(git -C "$CATALOG" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore frontend cache
      uses: actions/cache@v4
      with:
        path: |
          graph_out/frontends
          ${{ runner.temp }}/lachesis.kuzu
          ${{ runner.temp }}/lachesis.kuzu.enriched
        key: lachesis-graph-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.install-lachesis.outputs.engine_sha }}-${{ steps.install-atropos.outputs.catalog_sha }}-${{ hashFiles('**/*.c', '**/*.h', '**/*.cc', '**/*.cpp', '**/*.py', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/tsconfig*.json', '**/package.json', '**/pyproject.toml', '**/lachesis.toml') }}

    - name: Build graph
      shell: bash
      env:
        # Keep the Action's cold build from auto-sizing Kùzu to the whole runner.
        # Users with larger subsystems can raise this explicitly.
        LACHESIS_KUZU_BUFFER_POOL_SIZE: ${{ inputs.kuzu-buffer-pool-size }}
        LACHESIS_C_JOBS: ${{ inputs.c-jobs }}
      run: |
        lachesis-analyze "${{ inputs.source }}" "$RUNNER_TEMP/lachesis.kuzu" ${{ inputs.analyze-args }}

    - name: Export SARIF
      shell: bash
      env:
        # SARIF is one batch query; do not write a second graph-sized enriched cache
        # during the cold Action invocation. Local query users keep persistent caching.
        LACHESIS_QUERY_EPHEMERAL_ENRICH: "1"
      run: |
        ARGS=()
        if [ -n "${{ inputs.changed-files }}" ]; then
          ARGS+=(--changed-files "${{ inputs.changed-files }}")
        fi
        if [ -n "${{ inputs.exclude }}" ]; then
          ARGS+=(--exclude "${{ inputs.exclude }}")
        fi
        python3 "$GITHUB_ACTION_PATH/sarif_export.py" \
          "$RUNNER_TEMP/lachesis.kuzu" \
          --repo-root "$GITHUB_WORKSPACE" \
          -o "${{ inputs.sarif-file }}" \
          "${ARGS[@]}"

    - name: Upload to code scanning
      if: ${{ inputs.upload == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}

    - name: Gate on findings
      if: ${{ inputs.fail-on != 'none' }}
      shell: bash
      run: |
        python3 - "${{ inputs.sarif-file }}" "${{ inputs.fail-on }}" <<'PY'
        import json, sys
        order = {"note": 1, "warning": 2, "error": 3}
        sarif_file, threshold = sys.argv[1], sys.argv[2]
        if threshold not in order:
            print(f"lachesis: invalid fail-on value {threshold!r}; expected none, note, warning, or error")
            sys.exit(2)
        gate = order[threshold]
        results = json.load(open(sarif_file))["runs"][0]["results"]
        hits = [r for r in results if order.get(r.get("level", "warning"), 2) >= gate]
        if hits:
            print(f"lachesis: {len(hits)} finding(s) at or above '{threshold}'")
            sys.exit(1)
        print(f"lachesis: no findings at or above '{threshold}'")
        PY
