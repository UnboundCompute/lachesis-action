name: "Lachesis Security Scan"
description: "Trace untrusted input to sinks and catch the endpoint that forgot the authorization check, posted inline on the PR as Lachesis[bot]."
branding:
  icon: "git-branch"
  color: "purple"

inputs:
  source:
    description: "Directory to analyze, relative to the repo root."
    default: "."
  python-version:
    description: "Python runtime for the analyzer. Keep the default on the tested compatibility floor."
    default: "3.11"
  lachesis-repo:
    description: "Git URL to install Lachesis from (until the wheel is on PyPI)."
    default: "https://github.com/UnboundCompute/lachesis"
  lachesis-ref:
    description: "Branch, tag, or SHA of Lachesis to install."
    default: "v0.1.7"
  atropos-repo:
    description: "Git URL for the Atropos taint-model catalog."
    default: "https://github.com/UnboundCompute/atropos"
  atropos-ref:
    description: "Branch, tag, or SHA of Atropos to use. Pin a tag or SHA for reproducibility."
    default: "v1.7.1"
  analyze-args:
    description: "Extra flags passed to lachesis-analyze. Kept light by default."
    default: "--prune --incremental"
  c-jobs:
    description: "Optional Clang frontend concurrency override; empty uses the adaptive engine default."
    default: ""
  frontend-timeout:
    description: "Maximum seconds for one Lachesis frontend invocation."
    default: "300"
  query-timeout:
    description: "Maximum seconds for one SARIF graph query."
    default: "300"
  build-timeout:
    description: "Maximum seconds for the complete Lachesis graph build."
    default: "1800"
  kuzu-buffer-pool-size:
    description: "Kùzu buffer pool ceiling in bytes for graph materialization."
    default: "1073741824"
  sarif-file:
    description: "Where to write the SARIF report."
    default: "lachesis.sarif"
  candidate-report:
    description: "Optional Atropos-backed candidate census in the GitHub Actions job summary: none | census."
    default: "none"
  changed-files:
    description: "Optional space/comma-separated list; when set, only findings in these files are reported."
    default: ""
  exclude:
    description: "Optional space/comma-separated paths/globs; findings under these (e.g. a fixtures or vendor dir) are dropped."
    default: ""
  fail-on:
    description: "Fail the step if any finding is at this level or above: none | note | warning | error."
    default: "none"
  report-endpoint:
    description: >
      Hosted Lachesis poster URL. Findings are posted on the pull request as the
      Lachesis GitHub App (Lachesis[bot]). Requires 'permissions: id-token: write'
      in the calling workflow and the Lachesis app installed on the repo. Override
      only if you self-host the poster.
    default: "https://klh36ropm2fuyhbmomlhnzxfam0ehwzf.lambda-url.us-east-1.on.aws/"
  post-comments:
    description: "Post hosted Lachesis[bot] PR comments. Set false when using SARIF upload or another reporting path."
    default: "true"
  oidc-audience:
    description: "Audience requested for the OIDC token; must match the poster's configured audience."
    default: "lachesis-bot"

outputs:
  sarif-file:
    description: "Path to the generated SARIF report."
    value: ${{ steps.export-sarif.outputs.sarif-file }}
  candidate-report-file:
    description: "Path to the optional Atropos candidate census JSON, or empty when disabled."
    value: ${{ steps.export-candidates.outputs.candidate-report-file }}

runs:
  using: "composite"
  steps:
    - name: Validate inputs
      shell: bash
      env:
        LACHESIS_FAIL_ON: ${{ inputs.fail-on }}
        LACHESIS_KUZU_BUFFER_POOL_SIZE: ${{ inputs.kuzu-buffer-pool-size }}
        LACHESIS_C_JOBS: ${{ inputs.c-jobs }}
        LACHESIS_ANALYZE_ARGS: ${{ inputs.analyze-args }}
        LACHESIS_SARIF_FILE: ${{ inputs.sarif-file }}
        LACHESIS_CANDIDATE_REPORT: ${{ inputs.candidate-report }}
        LACHESIS_POST_COMMENTS: ${{ inputs.post-comments }}
        LACHESIS_SOURCE: ${{ inputs.source }}
        LACHESIS_REF: ${{ inputs.lachesis-ref }}
        ATROPOS_REF: ${{ inputs.atropos-ref }}
        LACHESIS_FRONTEND_TIMEOUT: ${{ inputs.frontend-timeout }}
        LACHESIS_QUERY_TIMEOUT: ${{ inputs.query-timeout }}
        LACHESIS_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
      run: python3 "$GITHUB_ACTION_PATH/validate_inputs.py"

    - name: Warn about mutable dependency refs
      shell: bash
      env:
        LACHESIS_REF: ${{ inputs.lachesis-ref }}
        ATROPOS_REF: ${{ inputs.atropos-ref }}
      run: |
        if [ "$LACHESIS_REF" = "main" ]; then
          echo "::warning title=Lachesis ref is mutable::Set lachesis-ref to a reviewed release tag for reproducible scans."
        fi
        if [ "$ATROPOS_REF" = "main" ]; then
          echo "::warning title=Atropos ref is mutable::Set atropos-ref to a reviewed release tag for reproducible scans."
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up Node
      # Needed at analyze time: the TypeScript frontend runs under node.
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Fingerprint analyzer toolchain
      id: toolchain
      shell: bash
      run: |
        {
          python3 --version
          node --version
          (clang --version 2>/dev/null || echo "clang unavailable")
        } | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())' | {
          read fingerprint
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        }

    - name: Install Lachesis (from source)
      id: install-lachesis
      # Install the selected engine ref from source so production workflows can pin
      # an exact commit and development workflows can test unreleased changes. The
      # TypeScript compiler is a build artifact absent from the repo, so vendor it
      # FIRST (a pure-Python fetch, no npm), then it gets packaged into the install.
      shell: bash
      env:
        LACHESIS_REPO_URL: ${{ inputs.lachesis-repo }}
        LACHESIS_REF: ${{ inputs.lachesis-ref }}
        GIT_TERMINAL_PROMPT: "0"
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "60"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_DEFAULT_TIMEOUT: "60"
      run: |
        SRC="$RUNNER_TEMP/lachesis-src"
        rm -rf "$SRC"
        clone_source() {
          local url="$1" dir="$2" ref="$3"
          if git clone --filter=blob:none --no-checkout --depth 1 "$url" "$dir"; then
            :
          else
            echo "partial clone is unavailable for this Git server; retrying without the blob filter"
            rm -rf "$dir"
            git clone --no-checkout --depth 1 "$url" "$dir"
          fi
          # Fetch the requested branch, tag, or SHA as a shallow object. This
          # keeps ref flexibility without downloading the repository history.
          git -C "$dir" fetch --depth 1 origin "$ref"
          git -C "$dir" checkout --detach FETCH_HEAD
        }
        # Keep ref flexibility (branch, tag, or SHA) without transferring every
        # blob or historical commit in the engine repository.
        clone_source "$LACHESIS_REPO_URL" "$SRC" "$LACHESIS_REF"
        echo "engine_sha=$(git -C "$SRC" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        python3 -m pip install --upgrade pip
        python3 "$SRC/tools/vendor_typescript.py"
        python3 -m pip install "$SRC"

    - name: Install Atropos catalog
      id: install-atropos
      shell: bash
      env:
        ATROPOS_REPO_URL: ${{ inputs.atropos-repo }}
        ATROPOS_REF: ${{ inputs.atropos-ref }}
        GIT_TERMINAL_PROMPT: "0"
        GIT_HTTP_LOW_SPEED_LIMIT: "1000"
        GIT_HTTP_LOW_SPEED_TIME: "60"
        PIP_NO_INPUT: "1"
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
        PIP_DEFAULT_TIMEOUT: "60"
      run: |
        CATALOG="$RUNNER_TEMP/atropos"
        rm -rf "$CATALOG"
        clone_source() {
          local url="$1" dir="$2" ref="$3"
          if git clone --filter=blob:none --no-checkout --depth 1 "$url" "$dir"; then
            :
          else
            echo "partial clone is unavailable for this Git server; retrying without the blob filter"
            rm -rf "$dir"
            git clone --no-checkout --depth 1 "$url" "$dir"
          fi
          git -C "$dir" fetch --depth 1 origin "$ref"
          git -C "$dir" checkout --detach FETCH_HEAD
        }
        clone_source "$ATROPOS_REPO_URL" "$CATALOG" "$ATROPOS_REF"
        python3 "$CATALOG/tools/validate.py"
        echo "ATROPOS_ROOT=$CATALOG" >> "$GITHUB_ENV"
        echo "catalog_sha=$(git -C "$CATALOG" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore frontend cache
      uses: actions/cache@v4
      with:
        path: |
          graph_out/frontends
          ${{ runner.temp }}/lachesis.kuzu
          ${{ runner.temp }}/lachesis.kuzu.enriched
        key: lachesis-graph-${{ runner.os }}-${{ steps.toolchain.outputs.fingerprint }}-${{ steps.install-lachesis.outputs.engine_sha }}-${{ steps.install-atropos.outputs.catalog_sha }}-${{ hashFiles('**/*.c', '**/*.h', '**/*.cc', '**/*.cpp', '**/*.py', '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/tsconfig*.json', '**/package.json', '**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/pyproject.toml', '**/lachesis.toml') }}

    - name: Build graph
      shell: bash
      env:
        # Keep the Action's cold build from auto-sizing Kùzu to the whole runner.
        # Users with larger subsystems can raise this explicitly.
        LACHESIS_KUZU_BUFFER_POOL_SIZE: ${{ inputs.kuzu-buffer-pool-size }}
        LACHESIS_C_JOBS: ${{ inputs.c-jobs }}
        LACHESIS_SOURCE: ${{ inputs.source }}
        LACHESIS_ANALYZE_ARGS: ${{ inputs.analyze-args }}
        LACHESIS_FRONTEND_TIMEOUT: ${{ inputs.frontend-timeout }}
        LACHESIS_BUILD_TIMEOUT: ${{ inputs.build-timeout }}
      run: |
        # Preserve shell-style quoting in the documented flag string without
        # evaluating it as shell code.
        python3 - <<'PY'
        import os
        import shlex
        import signal
        import subprocess

        args = [
            "lachesis-analyze",
            os.environ["LACHESIS_SOURCE"],
            os.path.join(os.environ["RUNNER_TEMP"], "lachesis.kuzu"),
            *shlex.split(os.environ["LACHESIS_ANALYZE_ARGS"]),
        ]
        if not any(arg == "--timeout" or arg.startswith("--timeout=") for arg in args):
            args.extend(("--timeout", os.environ["LACHESIS_FRONTEND_TIMEOUT"]))
        timeout = int(os.environ["LACHESIS_BUILD_TIMEOUT"])
        process = subprocess.Popen(args, start_new_session=(os.name == "posix"))
        try:
            return_code = process.wait(timeout=timeout)
        except subprocess.TimeoutExpired:
            if os.name == "posix":
                os.killpg(process.pid, signal.SIGKILL)
            else:  # pragma: no cover - GitHub's supported runners are POSIX
                process.kill()
            process.wait()
            raise SystemExit(
                f"lachesis: graph build exceeded build-timeout ({timeout}s)"
            )
        if return_code:
            raise SystemExit(return_code)
        PY

    - name: Export SARIF
      id: export-sarif
      shell: bash
      env:
        # SARIF is one batch query; do not write a second graph-sized enriched cache
        # during the cold Action invocation. Local query users keep persistent caching.
        LACHESIS_QUERY_EPHEMERAL_ENRICH: "1"
        LACHESIS_CHANGED_FILES: ${{ inputs.changed-files }}
        LACHESIS_EXCLUDE: ${{ inputs.exclude }}
        LACHESIS_SARIF_FILE: ${{ inputs.sarif-file }}
        LACHESIS_QUERY_TIMEOUT: ${{ inputs.query-timeout }}
        LACHESIS_ENGINE_SHA: ${{ steps.install-lachesis.outputs.engine_sha }}
        LACHESIS_CATALOG_SHA: ${{ steps.install-atropos.outputs.catalog_sha }}
        LACHESIS_TOOLCHAIN_FINGERPRINT: ${{ steps.toolchain.outputs.fingerprint }}
      run: |
        ARGS=()
        if [ -n "$LACHESIS_CHANGED_FILES" ]; then
          ARGS+=(--changed-files "$LACHESIS_CHANGED_FILES")
        fi
        if [ -n "$LACHESIS_EXCLUDE" ]; then
          ARGS+=(--exclude "$LACHESIS_EXCLUDE")
        fi
        python3 "$GITHUB_ACTION_PATH/sarif_export.py" \
          "$RUNNER_TEMP/lachesis.kuzu" \
          --repo-root "$GITHUB_WORKSPACE" \
          --query-timeout "$LACHESIS_QUERY_TIMEOUT" \
          --engine-sha "$LACHESIS_ENGINE_SHA" \
          --catalog-sha "$LACHESIS_CATALOG_SHA" \
          --toolchain-fingerprint "$LACHESIS_TOOLCHAIN_FINGERPRINT" \
          -o "$LACHESIS_SARIF_FILE" \
          "${ARGS[@]}"
        echo "sarif-file=$LACHESIS_SARIF_FILE" >> "$GITHUB_OUTPUT"

    - name: Summarize scan contract
      shell: bash
      env:
        LACHESIS_SARIF_FILE: ${{ inputs.sarif-file }}
        LACHESIS_ENGINE_SHA: ${{ steps.install-lachesis.outputs.engine_sha }}
        ATROPOS_SHA: ${{ steps.install-atropos.outputs.catalog_sha }}
        LACHESIS_CANDIDATE_REPORT: ${{ inputs.candidate-report }}
      run: |
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## Lachesis scan"
            echo
            echo "- SARIF: \`$LACHESIS_SARIF_FILE\` (taint/security-paths projection)"
            echo "- Engine: \`$LACHESIS_ENGINE_SHA\`"
            echo "- Atropos catalog: \`$ATROPOS_SHA\`"
            echo "- Candidate census: \`$LACHESIS_CANDIDATE_REPORT\`"
            echo
            echo "The SARIF projection reports source-to-sink security paths."
            echo "Use \`candidate-report: census\` to include catalog-backed obligation coverage in this summary."
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Export candidate census
      id: export-candidates
      if: ${{ inputs.candidate-report == 'census' }}
      shell: bash
      env:
        LACHESIS_CANDIDATE_FILE: ${{ runner.temp }}/lachesis-candidates.json
      run: |
        lachesis-candidates "$RUNNER_TEMP/lachesis.kuzu" --census > "$LACHESIS_CANDIDATE_FILE"
        echo "candidate-report-file=$LACHESIS_CANDIDATE_FILE" >> "$GITHUB_OUTPUT"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          python3 - "$LACHESIS_CANDIDATE_FILE" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            report = json.load(handle)
        print("\n### Candidate census\n")
        print("```json")
        print(json.dumps(report, indent=2, ensure_ascii=False))
        print("```")
        PY
        fi

    - name: Post PR comments (Lachesis[bot])
      # Deliver findings as the Lachesis GitHub App. Only meaningful on
      # pull_request; needs id-token: write so we can prove the repo to the
      # poster, and a report-endpoint pointing at the hosted poster.
      if: ${{ inputs.post-comments == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        LACHESIS_SARIF_FILE: ${{ inputs.sarif-file }}
        LACHESIS_REPORT_ENDPOINT: ${{ inputs.report-endpoint }}
        LACHESIS_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python3 "$GITHUB_ACTION_PATH/post_comments.py" "$LACHESIS_SARIF_FILE"

    - name: Gate on findings
      if: ${{ inputs.fail-on != 'none' }}
      shell: bash
      env:
        LACHESIS_SARIF_FILE: ${{ inputs.sarif-file }}
        LACHESIS_FAIL_ON: ${{ inputs.fail-on }}
      run: python3 "$GITHUB_ACTION_PATH/gate_sarif.py" "$LACHESIS_SARIF_FILE" "$LACHESIS_FAIL_ON"
