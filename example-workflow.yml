# Copy this into a consuming repo as .github/workflows/lachesis.yml
name: lachesis
on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: UnboundCompute/lachesis-action@51d7593825790ab01aa65887b0ad67d2366f306c # v1.0.0
        with:
          source: "."
          # exclude: "test/fixtures vendor"   # drop findings under these paths/globs
          # fail-on: "error"                   # fail the PR on guard differentials
          # lachesis-ref: "v1.0.0"             # pin the engine for reproducibility
          # atropos-ref: "<immutable-tag-or-sha>" # pin the model catalog too
