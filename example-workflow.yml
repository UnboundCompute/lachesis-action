# Copy this into a consuming repo as .github/workflows/lachesis.yml
# Requires the Lachesis GitHub App installed on the repo:
#   https://github.com/apps/lachesis
name: lachesis
on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # lets the action prove the repo to the Lachesis app
    steps:
      - uses: actions/checkout@v4

      - uses: UnboundCompute/lachesis-action@v1.0.3
        with:
          source: "."
          # exclude: "test/fixtures vendor"   # drop findings under these paths/globs
          # fail-on: "error"                   # fail the PR on guard differentials
          # lachesis-ref: "v0.1.3" # use a reviewed engine release tag
          # atropos-ref: "v1.7.1" # use a reviewed model-catalog release tag
